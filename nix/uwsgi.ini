; Base worker tuning, exposed as `qgisfeed.uwsgiIni`. Sets no socket: that is a
; host decision, and a deployment appends its own section.

[uwsgi]
plugins = python3
module = qgisfeedproject.wsgi

master = true

; The feed API is short and IO bound, so idle workers are wasted memory.
workers = 8
cheaper = 2

; Anything past 100s is stuck rather than slow.
harakiri = 100

memory-report = true

listen = 127

; Exit on SIGTERM rather than reloading, so systemctl stop behaves.
die-on-term = true
