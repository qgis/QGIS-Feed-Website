; Base uWSGI tuning for the QGIS Feed application.
;
; Exposed as `qgisfeed.uwsgiIni` so a deployment does not have to restate it.
; Deliberately contains no socket, no pidfile and no chdir: the socket is a
; host decision, and the wrapper in nix/package.nix already sets chdir and
; PYTHONPATH. Infrastructure should append its own [uwsgi] section, for example
;
;   uwsgi --ini ${qgisfeed.uwsgiIni} --ini /etc/qgisfeed/socket.ini
;
; or pass --socket on the command line.
;
; The worker figures belong here rather than in the infrastructure because they
; follow the application's memory profile, not the host's.

[uwsgi]
plugins = python3
module = qgisfeedproject.wsgi

master = true

; 8 workers with cheaper=2 keeps two resident and scales up on demand. The feed
; API is short and IO bound, so idle workers are mostly wasted memory.
workers = 8
cheaper = 2

; Requests are small; anything running past 100s is stuck rather than slow.
harakiri = 100

; Report per-worker memory in the log, which is what any future retuning of the
; numbers above should be based on.
memory-report = true

listen = 127

; Exit on SIGTERM instead of the uWSGI default of reloading, so that
; `systemctl stop` and `systemctl restart` behave as expected.
die-on-term = true
