{% load i18n %}

{% if sort_by == key and order == 'asc' %}
  <th scope="col" class="sso-sortable {{ classes }}" aria-sort="ascending">
    <a href="{% querystring sort_by=key order='desc' page=1 %}">
      <span>{{ label }}</span>
      <span class="icon is-small"><i class="fas fa-sort-up" aria-hidden="true"></i></span>
    </a>
  </th>
{% elif sort_by == key %}
  <th scope="col" class="sso-sortable {{ classes }}" aria-sort="descending">
    <a href="{% querystring sort_by=key order='asc' page=1 %}">
      <span>{{ label }}</span>
      <span class="icon is-small"><i class="fas fa-sort-down" aria-hidden="true"></i></span>
    </a>
  </th>
{% else %}
  <th scope="col" class="sso-sortable {{ classes }}" aria-sort="none">
    <a href="{% querystring sort_by=key order=natural page=1 %}">
      <span>{{ label }}</span>
      <span class="icon is-small"><i class="fas fa-sort" aria-hidden="true"></i></span>
    </a>
  </th>
{% endif %}
