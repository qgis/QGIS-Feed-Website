name: test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.12'

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    - name: Checkout
      uses: actions/checkout@v5

    - name: Install Python requirements
      run: pip install -r REQUIREMENTS.txt

  assets:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm

    - name: Install from the lockfile
      run: npm ci

    - name: Build the bundles
      run: npm run build

  test:
    name: Run checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The virtual machine check needs more disk than a runner ships with.
      - name: Reclaim disk space for the Nix store
        uses: wimpysworld/nothing-but-nix@main

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # Authenticated input fetches, so the run does not hit the anonymous
          # GitHub API rate limit.
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Enable the Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # The Django suite against PostGIS, the closure under systemd in a VM,
      # and treefmt over Nix, shell and Python.
      - name: Run the checks
        run: nix flake check -L

      - name: Build the application package
        run: nix build .#qgisfeed -L --no-link
