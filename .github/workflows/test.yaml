name: test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The virtual machine check needs more disk than a runner ships with.
      - name: Reclaim disk space for the Nix store
        uses: wimpysworld/nothing-but-nix@main

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # Authenticated input fetches, so the run does not hit the anonymous
          # GitHub API rate limit.
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Enable the Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # The Django suite against PostGIS, the closure under systemd in a VM,
      # and treefmt over Nix, shell and Python.
      - name: Run the checks
        run: nix flake check -L

      - name: Build the application package
        run: nix build .#qgisfeed -L --no-link
